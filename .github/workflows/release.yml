name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version label for a manual release (e.g. v0.1.1-test)"
        required: true
        default: "v0.0.0-manual"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve tag
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "starlette>=0.37.2,<0.39.0" "sse-starlette==2.1.3"
          pip install --prefer-binary --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu llama-cpp-python
          pip install pyinstaller onnxruntime

      - name: Build exe (PyInstaller)
        shell: pwsh
        run: pyinstaller --noconfirm --clean MediAssistPro.spec

      - name: Stage source bundle
        shell: pwsh
        run: |
          $dst = "staging/MediAssistPro"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $exclude = @('.git','.github','.venv','venv','models_local','dist','build',
                       'main.dist','main.build','data','test_db','logs','staging')
          Get-ChildItem -Force -Path . | Where-Object { $exclude -notcontains $_.Name } |
            ForEach-Object { Copy-Item $_.FullName -Destination $dst -Recurse -Force }

      - name: Zip artifacts
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          Compress-Archive -Path dist/MediAssistPro/* -DestinationPath "MediAssistPro-win64-$tag.zip" -Force
          Compress-Archive -Path staging/MediAssistPro/* -DestinationPath "MediAssistPro-src-$tag.zip" -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: MediAssistPro-*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: MediAssist Pro ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: MediAssistPro-*.zip
