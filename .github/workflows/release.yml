name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/version label for a manual release (e.g. v0.1.0-test)"
        required: true
        default: "v0.0.0-manual"

permissions:
  contents: write

jobs:
  source-bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage source bundle
        shell: bash
        run: |
          set -e
          mkdir -p staging/MediAssistPro
          # copy everything except heavy / local-only paths
          rsync -a --delete \
            --exclude '.git' --exclude '.github' --exclude '.venv' --exclude 'venv' \
            --exclude 'models_local' --exclude 'dist' --exclude 'build' \
            --exclude 'main.dist' --exclude 'main.build' --exclude 'data' \
            --exclude 'test_db' --exclude 'logs' --exclude '__pycache__' \
            --exclude '*.gguf' --exclude '*.db' --exclude 'staging' \
            ./ staging/MediAssistPro/
          cp scripts/Install_And_Run.bat staging/MediAssistPro/Install_And_Run.bat || true

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path staging/MediAssistPro/* -DestinationPath "MediAssistPro-src-${{ steps.ver.outputs.tag }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-bundle
          path: MediAssistPro-src-*.zip

  pyinstaller-build:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "sse-starlette==2.1.3" "starlette>=0.37.2,<0.39.0"
          pip install --prefer-binary --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu llama-cpp-python
          pip install pyinstaller onnxruntime

      - name: Build
        shell: pwsh
        run: pyinstaller --noconfirm MediAssistPro.spec

      - name: Zip build
        shell: pwsh
        run: Compress-Archive -Path dist/MediAssistPro/* -DestinationPath "MediAssistPro-win64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-build
          path: MediAssistPro-win64.zip

  release:
    needs: [source-bundle, pyinstaller-build]
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve tag
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: MediAssist Pro ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
