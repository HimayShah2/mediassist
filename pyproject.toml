[project]
name = "mediassist-pro"
version = "2.0.0"
description = "AI-powered clinical intake and decision-support system for humanitarian healthcare"
requires-python = ">=3.11,<3.13"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
qt_api = "pyside6"
